<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Markerless AR Component Viewer</title>
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js/aframe/build/aframe-ar.js"></script>
    <style>
        body { margin: 0; font-family: Arial, sans-serif; }
        #loading { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 1000; color: white; font-size: 18px; background: rgba(0,0,0,0.8); padding: 20px; border-radius: 10px; }
        #ui-overlay { position: fixed; top: 20px; left: 20px; z-index: 1000; display: flex; flex-direction: column; gap: 10px; }
        #component-dropdown { padding: 12px 16px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: 500; box-shadow: 0 4px 15px rgba(0,0,0,0.2); min-width: 200px; }
        #back-btn { padding: 10px 20px; background: #6c757d; color: white; border: none; border-radius: 5px; cursor: pointer; }
        #instructions { position: fixed; bottom: 20px; left: 20px; right: 20px; background: rgba(0,0,0,0.8); color: white; padding: 15px; border-radius: 10px; text-align: center; z-index: 1000; }
    </style>
</head>
<body>
    <div id="loading">Starting AR Camera...</div>
    
    <a-scene 
        embedded
        arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3;"
        vr-mode-ui="enabled: false"
        device-orientation-permission-ui="enabled: false">
        
        <a-assets>
            <a-asset-item id="air-inlet" src="./models_new/Air_inlet_and_cowling_section.glb"></a-asset-item>
            <a-asset-item id="compressor" src="./models_new/compressor_section.glb"></a-asset-item>
            <a-asset-item id="combustion" src="./models_new/Combustion_section.glb"></a-asset-item>
            <a-asset-item id="turbine" src="./models_new/Turbine_section.glb"></a-asset-item>
            <a-asset-item id="exhaust" src="./models_new/exhaust_section.glb"></a-asset-item>
        </a-assets>

        <a-entity id="ar-content" position="0 0 -1.5">
            <!-- Centered Model -->
            <a-gltf-model 
                id="current-model"
                src="#air-inlet" 
                position="0 0 0" 
                scale="0.2 0.2 0.2"
                rotation="0 0 0">
            </a-gltf-model>

            <!-- UI Panel on Left -->
            <a-plane 
                id="ui-panel"
                position="-0.8 0 0.3" 
                rotation="0 15 0"
                width="0.6" 
                height="1.2" 
                color="#2c3e50" 
                opacity="0.9">
                
                <a-text 
                    value="Components" 
                    position="0 0.5 0.05" 
                    align="center" 
                    color="white" 
                    width="4"
                    look-at="[camera]">
                </a-text>
                
                <a-box 
                    id="btn-air-inlet"
                    class="component-btn"
                    position="0 0.3 0.05" 
                    width="0.5" 
                    height="0.12" 
                    depth="0.02" 
                    color="#3498db"
                    data-component="air-inlet">
                    <a-text value="Air Inlet" position="0 0 0.05" align="center" color="white" width="3" look-at="[camera]"></a-text>
                </a-box>
                
                <a-box 
                    id="btn-compressor"
                    class="component-btn"
                    position="0 0.15 0.05" 
                    width="0.5" 
                    height="0.12" 
                    depth="0.02" 
                    color="#e74c3c"
                    data-component="compressor">
                    <a-text value="Compressor" position="0 0 0.05" align="center" color="white" width="3" look-at="[camera]"></a-text>
                </a-box>
                
                <a-box 
                    id="btn-combustion"
                    class="component-btn"
                    position="0 0 0.05" 
                    width="0.5" 
                    height="0.12" 
                    depth="0.02" 
                    color="#f39c12"
                    data-component="combustion">
                    <a-text value="Combustion" position="0 0 0.05" align="center" color="white" width="3" look-at="[camera]"></a-text>
                </a-box>
                
                <a-box 
                    id="btn-turbine"
                    class="component-btn"
                    position="0 -0.15 0.05" 
                    width="0.5" 
                    height="0.12" 
                    depth="0.02" 
                    color="#9b59b6"
                    data-component="turbine">
                    <a-text value="Turbine" position="0 0 0.05" align="center" color="white" width="3" look-at="[camera]"></a-text>
                </a-box>
                
                <a-box 
                    id="btn-exhaust"
                    class="component-btn"
                    position="0 -0.3 0.05" 
                    width="0.5" 
                    height="0.12" 
                    depth="0.02" 
                    color="#27ae60"
                    data-component="exhaust">
                    <a-text value="Exhaust" position="0 0 0.05" align="center" color="white" width="3" look-at="[camera]"></a-text>
                </a-box>
            </a-plane>

            <!-- Description Panel on Right -->
            <a-plane 
                id="description-panel-3d"
                position="0.8 0 0.3" 
                rotation="0 -15 0"
                width="0.8" 
                height="0.8" 
                color="white" 
                opacity="0.95">
                
                <a-text 
                    id="description-title-3d"
                    value="Air Inlet" 
                    position="0 0.25 0.05" 
                    align="center" 
                    color="#2c3e50" 
                    width="4"
                    look-at="[camera]">
                </a-text>
                
                <a-text 
                    id="description-content-3d"
                    value="Gets air to compressor with minimal drag." 
                    position="0 -0.1 0.05" 
                    align="center" 
                    color="#34495e" 
                    width="3"
                    wrap-count="15"
                    look-at="[camera]">
                </a-text>
            </a-plane>
        </a-entity>

        <a-entity camera fov="60"></a-entity>
    </a-scene>
    
    <div id="ui-overlay">
        <button id="back-btn" onclick="window.location.href='./viewer.html'">← Back</button>
        
        <select id="component-dropdown">
            <option value="air-inlet">Air Inlet</option>
            <option value="compressor">Compressor Section</option>
            <option value="combustion">Combustion Section</option>
            <option value="turbine">Turbine Section</option>
            <option value="exhaust">Exhaust Section</option>
        </select>
    </div>
    
    <div id="instructions">
        Point your camera around to see the 3D model and controls in AR space
    </div>
    
    <script>
        const componentDescriptions = {
            'air-inlet': {
                title: 'Air Inlet & Cowling',
                content: 'Gets air to compressor with minimal drag.'
            },
            'compressor': {
                title: 'Compressor Section',
                content: 'Supplies high-pressure air to burners.'
            },
            'combustion': {
                title: 'Combustion Section',
                content: 'Burns fuel to heat air for energy.'
            },
            'turbine': {
                title: 'Turbine Section',
                content: 'Captures energy from hot gases.'
            },
            'exhaust': {
                title: 'Exhaust Section',
                content: 'Directs gases out creating thrust.'
            }
        };

        document.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                document.getElementById('loading').style.display = 'none';
            }, 2000);
            
            const urlParams = new URLSearchParams(window.location.search);
            const componentParam = urlParams.get('component');
            
            const currentModel = document.querySelector('#current-model');
            const descriptionTitle = document.querySelector('#description-title-3d');
            const descriptionContent = document.querySelector('#description-content-3d');
            const componentButtons = document.querySelectorAll('.component-btn');
            const dropdown = document.querySelector('#component-dropdown');
            
            function updateComponent(component) {
                currentModel.setAttribute('src', `#${component}`);
                
                const description = componentDescriptions[component];
                if (description) {
                    descriptionTitle.setAttribute('value', description.title);
                    descriptionContent.setAttribute('value', description.content);
                }
                
                componentButtons.forEach(btn => btn.setAttribute('opacity', '0.7'));
                const targetBtn = document.querySelector(`#btn-${component}`);
                if (targetBtn) targetBtn.setAttribute('opacity', '1');
                
                dropdown.value = component;
            }
            
            if (componentParam && componentDescriptions[componentParam]) {
                updateComponent(componentParam);
            }
            
            dropdown.addEventListener('change', (e) => {
                updateComponent(e.target.value);
            });
            
            componentButtons.forEach(button => {
                button.addEventListener('click', () => {
                    const component = button.getAttribute('data-component');
                    updateComponent(component);
                });
            });
        });
    </script>
</body>
</html>
