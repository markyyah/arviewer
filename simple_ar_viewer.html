<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple AR Component Viewer</title>
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js/aframe/build/aframe-ar.js"></script>
    <style>
        body { margin: 0; font-family: Arial, sans-serif; }
        #loading { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 1000; color: white; font-size: 18px; background: rgba(0,0,0,0.8); padding: 20px; border-radius: 10px; }
        #back-btn { position: fixed; top: 20px; left: 20px; z-index: 1000; padding: 10px 20px; background: #6c757d; color: white; border: none; border-radius: 5px; cursor: pointer; }
        #instructions { position: fixed; bottom: 20px; left: 20px; right: 20px; background: rgba(0,0,0,0.8); color: white; padding: 15px; border-radius: 10px; text-align: center; z-index: 1000; }
    </style>
</head>
<body>
    <div id="loading">Starting AR Camera...</div>
    
    <a-scene 
        embedded
        arjs="sourceType: webcam; debugUIEnabled: false;"
        vr-mode-ui="enabled: false"
        device-orientation-permission-ui="enabled: false">
        
        <a-assets>
            <a-asset-item id="air-inlet" src="./models_new/Air_inlet_and_cowling_section.glb"></a-asset-item>
            <a-asset-item id="compressor" src="./models_new/compressor_section.glb"></a-asset-item>
            <a-asset-item id="combustion" src="./models_new/Combustion_section.glb"></a-asset-item>
            <a-asset-item id="turbine" src="./models_new/Turbine_section.glb"></a-asset-item>
            <a-asset-item id="exhaust" src="./models_new/exhaust_section.glb"></a-asset-item>
        </a-assets>

        <!-- Debug box to show AR is working -->
        <a-box position="0 0.5 -3" material="color: red" scale="0.3 0.3 0.3"></a-box>
        
        <a-entity id="ar-content" position="0 0 -3">
            <a-box 
                id="current-model"
                position="0 0 0" 
                scale="1 1 1"
                rotation="0 0 0"
                material="color: blue">
            </a-box>
        </a-entity>

        <a-entity camera></a-entity>
    </a-scene>
    
    <button id="back-btn" onclick="window.location.href='./viewer.html'">← Back</button>
    
    <div id="instructions">
        Look for a RED BOX and BLUE BOX - both should be visible in AR space.
    </div>
    
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                document.getElementById('loading').style.display = 'none';
            }, 2000);
            
            const urlParams = new URLSearchParams(window.location.search);
            const componentParam = urlParams.get('component');
            
            const currentModel = document.querySelector('#current-model');
            
            if (componentParam) {
                currentModel.setAttribute('src', `#${componentParam}`);
            }
        });
    </script>
</body>
</html>
