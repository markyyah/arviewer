<!DOCTYPE html>
<html>
<head>
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js/aframe/build/aframe-ar.js"></script>
</head>
<body style="margin: 0;">
    <a-scene 
        embedded
        arjs="sourceType: webcam; debugUIEnabled: false;"
        vr-mode-ui="enabled: false">
        
        <a-assets>
            <a-asset-item id="test-model" src="./models_new/Air_inlet_and_cowling_section.glb"></a-asset-item>
        </a-assets>

        <!-- Add a visible red box first to test positioning -->
        <a-box position="0 0.5 -3" material="color: red" scale="0.5 0.5 0.5"></a-box>
        
        <!-- Add a blue box instead of model -->
        <a-box 
            position="0 0 -3" 
            scale="1 1 1"
            rotation="0 0 0"
            material="color: blue">
        </a-box>

        <a-entity camera></a-entity>
    </a-scene>
    
    <div style="position: fixed; top: 10px; left: 10px; color: white; background: rgba(0,0,0,0.8); padding: 10px; border-radius: 5px; z-index: 1000;">
        You should see a RED BOX first. If no red box, AR isn't working.<br>
        Model should appear near the red box.
    </div>
</body>
</html>
