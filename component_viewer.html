<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Component Viewer - AR Turbine Engine</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <model-viewer 
        id="component-model-viewer"
        src="./test.glb" 
        alt="Turbine Engine Component"
        ar 
        ar-modes="scene-viewer webxr quick-look" 
        ar-scale="fixed"
        camera-controls 
        tone-mapping="neutral" 
        poster="./poster.webp" 
        shadow-intensity="1.18" 
        shadow-softness="0.4" 
        autoplay 
        environment-image="./aircraft_workshop_01_1k.hdr" 
        interpolation-decay="200" 
        camera-orbit-transition-time="2000ms">
        
        <div class="progress-bar hide" slot="progress-bar">
            <div class="update-bar"></div>
        </div>
        
        <button slot="ar-button" id="ar-button" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border: none; padding: 15px 30px; border-radius: 25px; font-size: 16px; font-weight: 600; box-shadow: 0 4px 15px rgba(0,0,0,0.3); cursor: pointer;">
            🚀 View in AR
        </button>
        
        <div id="ar-prompt">
            <img src="./ar_hand_prompt.png">
        </div>
    </model-viewer>
    
    <div id="ar-ui" style="position: fixed; top: 20px; left: 20px; z-index: 1000; display: flex; flex-direction: column; gap: 10px;">
        <button id="back-btn" style="padding: 10px 20px; background: #6c757d; color: white; border: none; border-radius: 5px; cursor: pointer;" onclick="window.location.href='./index.html'">← Back to Full Model</button>
        
        <select id="component-dropdown" style="padding: 12px 16px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: 500; box-shadow: 0 4px 15px rgba(0,0,0,0.2); min-width: 200px;">
            <option value="" style="background: white; color: black;">Select Component</option>
            <option value="Air_inlet_and_cowling_section.glb" style="background: white; color: black;">Air Inlet & Cowling</option>
            <option value="compressor_section.glb" style="background: white; color: black;">Compressor Section</option>
            <option value="Combustion_section.glb" style="background: white; color: black;">Combustion Section</option>
            <option value="Turbine_section.glb" style="background: white; color: black;">Turbine Section</option>
            <option value="exhaust_section.glb" style="background: white; color: black;">Exhaust Section</option>
        </select>
    </div>
    
    <div id="description-panel" style="display: none; position: fixed; bottom: 20px; left: 20px; max-width: 350px; background: rgba(255,255,255,0.95); padding: 20px; border-radius: 12px; box-shadow: 0 8px 32px rgba(0,0,0,0.3); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.2); z-index: 1000;">
        <h3 id="description-title" style="margin: 0 0 15px 0; color: #333; font-size: 18px; font-weight: 600;"></h3>
        <div id="description-content" style="color: #555; font-size: 14px; line-height: 1.6;"></div>
    </div>
    
    <script>
        // Component descriptions
        const componentDescriptions = {
            'Air_inlet_and_cowling_section.glb': {
                title: 'Air Inlet & Cowling',
                content: `
                    <p>The air inlet must get air to the compressor with the least possible fuss, meaning it should cause very little drag or pressure loss.</p>
                    <p><strong>Goal:</strong> The air flow entering the compressor needs to be smooth and free of turbulence (rough, choppy flow).</p>
                    <p><strong>Result:</strong> A good design ensures maximum operating efficiency and helps boost the final pressure the compressor can create. Basically, a well-designed inlet helps the engine work better and makes the aircraft perform better.</p>
                `
            },
            'compressor_section.glb': {
                title: 'Compressor Section',
                content: `
                    <p>The main job of the compressor in a gas turbine engine is to supply enough high-pressure air to the combustion burners.</p>
                    <p><strong>Goal:</strong> The compressor must take the large mass of air from the inlet and increase its pressure significantly.</p>
                    <p><strong>Result:</strong> It then discharges this air to the burners in the exact quantity and at the necessary pressure required for the fuel to burn efficiently and powerfully.</p>
                `
            },
            'Combustion_section.glb': {
                title: 'Combustion Section',
                content: `
                    <p>The combustion section is where fuel is burned to make the air hotter.</p>
                    <p><strong>Goal:</strong> The process of burning the air/fuel mixture releases energy (heat).</p>
                    <p><strong>Result:</strong> The largest portion of this released energy is immediately used to spin the turbine blades, which in turn drives the compressor.</p>
                `
            },
            'Turbine_section.glb': {
                title: 'Turbine Section',
                content: `
                    <p>The turbine acts like a highly efficient windmill in the hot exhaust gas stream.</p>
                    <p><strong>Goal:</strong> To capture the energy from the hot, high-pressure exhaust gases and turn it into mechanical energy (rotation).</p>
                    <p><strong>Result:</strong> It uses about 60% to 70% of the gas pressure energy to drive the compressor (the part that feeds air into the engine) and all the engine's accessories.</p>
                `
            },
            'exhaust_section.glb': {
                title: 'Exhaust Section',
                content: `
                    <p>The exhaust section is the final part of the engine where the gases exit.</p>
                    <p><strong>Goal:</strong> To smooth out the flow of the hot gases, prevent turbulence, and direct them out the rear of the engine.</p>
                    <p><strong>Result:</strong> It gives the exhaust gases a high final speed (velocity) as they exit the engine, which produces the thrust (forward push).</p>
                `
            }
        };

        // Wait for page to load
        window.addEventListener('DOMContentLoaded', () => {
            const modelViewer = document.querySelector('#component-model-viewer');
            const dropdown = document.querySelector('#component-dropdown');
            const descriptionTitle = document.querySelector('#description-title');
            const descriptionContent = document.querySelector('#description-content');
            
            // Handle dropdown change
            dropdown.addEventListener('change', (e) => {
                const selectedModel = e.target.value;
                console.log(`Switching to: ${selectedModel}`);
                
                if (selectedModel === '') {
                    // Show default test.glb model
                    modelViewer.src = './test.glb';
                    document.getElementById('description-panel').style.display = 'none';
                } else {
                    // Update model source to component
                    modelViewer.src = `./models_new/${selectedModel}`;
                    
                    // Update description
                    const description = componentDescriptions[selectedModel];
                    if (description) {
                        descriptionTitle.textContent = description.title;
                        descriptionContent.innerHTML = description.content;
                        document.getElementById('description-panel').style.display = 'block';
                    }
                }
                
                // Reset camera to default position
                modelViewer.cameraOrbit = '-0.8355192608086832rad 0.9153384632743027rad 1195.1577537734665m';
                modelViewer.cameraTarget = '-41.99543672808999m -6.491963504212178m -83.71453391574049m';
            });
            
            // Progress bar handling
            const onProgress = (event) => {
                const progressBar = event.target.querySelector('.progress-bar');
                const updatingBar = event.target.querySelector('.update-bar');
                updatingBar.style.width = `${event.detail.totalProgress * 100}%`;
                if (event.detail.totalProgress === 1) {
                    progressBar.classList.add('hide');
                    event.target.removeEventListener('progress', onProgress);
                } else {
                    progressBar.classList.remove('hide');
                }
            };
            modelViewer.addEventListener('progress', onProgress);
        });
    </script>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>
</body>
</html>
