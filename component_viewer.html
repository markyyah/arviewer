<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR Component Viewer - World Space UI</title>
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v7.0.0/dist/aframe-extras.min.js"></script>
    <style>
        body { margin: 0; font-family: Arial, sans-serif; }
        #loading { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 1000; color: white; font-size: 18px; }
    </style>
</head>
<body>
    <div id="loading">Loading AR...</div>
    <a-scene 
        background="color: transparent"
        webxr="requiredFeatures: hit-test,local-floor; optionalFeatures: dom-overlay,unbounded; overlayElement: #overlay;"
        renderer="colorManagement: true, physicallyCorrectLights"
        device-orientation-permission-ui="enabled: false">
        
        <a-assets>
            <a-asset-item id="air-inlet" src="./models_new/Air_inlet_and_cowling_section.glb"></a-asset-item>
            <a-asset-item id="compressor" src="./models_new/compressor_section.glb"></a-asset-item>
            <a-asset-item id="combustion" src="./models_new/Combustion_section.glb"></a-asset-item>
            <a-asset-item id="turbine" src="./models_new/Turbine_section.glb"></a-asset-item>
            <a-asset-item id="exhaust" src="./models_new/exhaust_section.glb"></a-asset-item>
        </a-assets>

        <a-camera 
            id="camera"
            position="0 1.6 3" 
            look-controls="enabled: true"
            wasd-controls="enabled: false"
            cursor="rayOrigin: mouse">
        </a-camera>

        <a-entity id="ar-content" position="0 0 -2">
            <!-- 3D Model -->
            <a-gltf-model 
                id="current-model"
                src="#air-inlet" 
                position="0 0 0" 
                rotation="0 0 0"
                scale="0.5 0.5 0.5"
                animation-mixer="clip: *; loop: repeat">
            </a-gltf-model>

            <!-- UI Panel in 3D Space -->
            <a-plane 
                id="ui-panel"
                position="-1.5 0.8 0" 
                rotation="0 30 0"
                width="1.2" 
                height="1.5" 
                color="#2c3e50" 
                opacity="0.9">
                
                <!-- Title -->
                <a-text 
                    value="Component Viewer" 
                    position="0 0.6 0.01" 
                    align="center" 
                    color="white" 
                    width="8">
                </a-text>
                
                <!-- Component Buttons -->
                <a-box 
                    id="btn-air-inlet"
                    class="component-btn"
                    position="0 0.3 0.01" 
                    width="1" 
                    height="0.15" 
                    depth="0.02" 
                    color="#3498db"
                    data-component="air-inlet">
                    <a-text value="Air Inlet" position="0 0 0.02" align="center" color="white" width="6"></a-text>
                </a-box>
                
                <a-box 
                    id="btn-compressor"
                    class="component-btn"
                    position="0 0.1 0.01" 
                    width="1" 
                    height="0.15" 
                    depth="0.02" 
                    color="#e74c3c"
                    data-component="compressor">
                    <a-text value="Compressor" position="0 0 0.02" align="center" color="white" width="6"></a-text>
                </a-box>
                
                <a-box 
                    id="btn-combustion"
                    class="component-btn"
                    position="0 -0.1 0.01" 
                    width="1" 
                    height="0.15" 
                    depth="0.02" 
                    color="#f39c12"
                    data-component="combustion">
                    <a-text value="Combustion" position="0 0 0.02" align="center" color="white" width="6"></a-text>
                </a-box>
                
                <a-box 
                    id="btn-turbine"
                    class="component-btn"
                    position="0 -0.3 0.01" 
                    width="1" 
                    height="0.15" 
                    depth="0.02" 
                    color="#9b59b6"
                    data-component="turbine">
                    <a-text value="Turbine" position="0 0 0.02" align="center" color="white" width="6"></a-text>
                </a-box>
                
                <a-box 
                    id="btn-exhaust"
                    class="component-btn"
                    position="0 -0.5 0.01" 
                    width="1" 
                    height="0.15" 
                    depth="0.02" 
                    color="#27ae60"
                    data-component="exhaust">
                    <a-text value="Exhaust" position="0 0 0.02" align="center" color="white" width="6"></a-text>
                </a-box>
            </a-plane>

            <!-- Description Panel in 3D Space -->
            <a-plane 
                id="description-panel-3d"
                position="1.5 0 0" 
                rotation="0 -30 0"
                width="1.8" 
                height="1.2" 
                color="white" 
                opacity="0.95">
                
                <a-text 
                    id="description-title-3d"
                    value="Air Inlet & Cowling" 
                    position="0 0.4 0.01" 
                    align="center" 
                    color="#2c3e50" 
                    width="6">
                </a-text>
                
                <a-text 
                    id="description-content-3d"
                    value="The air inlet gets air to the compressor with minimal drag or pressure loss. Smooth airflow is essential for efficiency." 
                    position="0 -0.1 0.01" 
                    align="center" 
                    color="#34495e" 
                    width="4"
                    wrap-count="35">
                </a-text>
            </a-plane>
        </a-entity>
        
        <!-- Ground plane for reference -->
        <a-plane 
            position="0 0 0" 
            rotation="-90 0 0" 
            width="10" 
            height="10" 
            color="#cccccc" 
            opacity="0.1" 
            visible="false">
        </a-plane>
    </a-scene>
    
    <div id="overlay" style="position: fixed; top: 20px; left: 20px; z-index: 1000;">
        <button id="place-model" style="padding: 10px 20px; background: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer;">Place Model</button>
        <button id="back-btn" style="padding: 10px 20px; background: #6c757d; color: white; border: none; border-radius: 5px; cursor: pointer; margin-left: 10px;" onclick="window.location.href='./index.html'">← Back</button>
    </div>
    
    <script>
        // Component descriptions
        const componentDescriptions = {
            'air-inlet': {
                title: 'Air Inlet & Cowling',
                content: 'The air inlet gets air to the compressor with minimal drag or pressure loss. Smooth airflow is essential for efficiency.'
            },
            'compressor': {
                title: 'Compressor Section',
                content: 'The compressor supplies high-pressure air to combustion burners by increasing air pressure significantly.'
            },
            'combustion': {
                title: 'Combustion Section',
                content: 'The combustion section burns fuel to heat air. This energy spins turbine blades and drives the compressor.'
            },
            'turbine': {
                title: 'Turbine Section',
                content: 'The turbine captures energy from hot exhaust gases, using 60-70% to drive the compressor and accessories.'
            },
            'exhaust': {
                title: 'Exhaust Section',
                content: 'The exhaust section smooths gas flow and directs it out, creating high-speed thrust for the aircraft.'
            }
        };

        // Wait for A-Frame to load
        document.addEventListener('DOMContentLoaded', () => {
            const scene = document.querySelector('a-scene');
            const arContent = document.querySelector('#ar-content');
            const placeButton = document.querySelector('#place-model');
            let isPlaced = false;
            
            setTimeout(() => {
                document.getElementById('loading').style.display = 'none';
                
                const currentModel = document.querySelector('#current-model');
                const descriptionTitle = document.querySelector('#description-title-3d');
                const descriptionContent = document.querySelector('#description-content-3d');
                const componentButtons = document.querySelectorAll('.component-btn');
                
                // Place model button
                placeButton.addEventListener('click', () => {
                    if (!isPlaced) {
                        arContent.setAttribute('visible', true);
                        placeButton.textContent = 'Model Placed';
                        placeButton.disabled = true;
                        isPlaced = true;
                    }
                });
                
                // Add click handlers to component buttons
                componentButtons.forEach(button => {
                    button.addEventListener('click', () => {
                        const component = button.getAttribute('data-component');
                        console.log(`Switching to: ${component}`);
                        
                        // Update model
                        currentModel.setAttribute('src', `#${component}`);
                        
                        // Update description
                        const description = componentDescriptions[component];
                        if (description) {
                            descriptionTitle.setAttribute('value', description.title);
                            descriptionContent.setAttribute('value', description.content);
                        }
                        
                        // Visual feedback - highlight selected button
                        componentButtons.forEach(btn => {
                            btn.setAttribute('opacity', '0.7');
                        });
                        button.setAttribute('opacity', '1');
                    });
                });
                
                // Set initial button highlight
                document.querySelector('#btn-air-inlet').setAttribute('opacity', '1');
                componentButtons.forEach(btn => {
                    if (btn.id !== 'btn-air-inlet') {
                        btn.setAttribute('opacity', '0.7');
                    }
                });
                
                // Initially hide AR content until placed
                arContent.setAttribute('visible', false);
                
            }, 2000);
        });
    </script>
</body>
</html>
